<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PitVoice AI Overlay</title>
<style>
  :root { --akzent: #FFC83D; --lila: #C9A2FF; --rot: #FF7A6E; --gruen: #3DDC84; --text: #F2F3F5; --leise: #9EA3AD;
          --zahl: "Bahnschrift SemiCondensed", "Bahnschrift", "Arial Narrow", sans-serif; }
  html, body { margin: 0; height: 100%; background: #0B0B0E; color: var(--text); overflow: hidden; user-select: none;
               font-family: "Segoe UI", system-ui, sans-serif; cursor: move; }
  .box { position: absolute; inset: 0; padding: 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;
         background: radial-gradient(120% 90% at 0% 0%, rgba(255, 138, 31, 0.16), transparent 60%), #0B0B0E;
         border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16); }
  .oben { display: flex; align-items: flex-end; gap: 14px; }
  .platz { font-family: var(--zahl); font-size: 50px; line-height: 0.85; font-weight: 700; color: var(--akzent);
           text-shadow: 0 0 18px rgba(255, 200, 61, 0.4); }
  .gesamt { font-family: var(--zahl); font-size: 18px; color: var(--leise); padding-bottom: 3px; }
  .abst { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 0; margin-left: auto; text-align: right; }
  .abst .w { font-family: var(--zahl); font-size: 22px; font-weight: 700; }
  .abst .n { font-size: 11px; color: var(--leise); align-self: center; text-align: left; max-width: 90px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .zeile { display: flex; gap: 14px; font-size: 12px; color: var(--leise); }
  .zeile b { font-family: var(--zahl); font-size: 15px; color: var(--text); font-weight: 600; }
  .funk { font-size: 12px; line-height: 1.3; color: #E8D9A8; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .knapp { color: var(--rot) !important; }
  .schliessen { position: absolute; right: 6px; top: 4px; border: 0; background: none; color: var(--leise); font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <button class="schliessen" id="zu" aria-label="Overlay schließen">✕</button>
  <div class="oben">
    <span class="platz" id="platz">–</span><span class="gesamt" id="gesamt"></span>
    <div class="abst">
      <span class="w" id="vw"></span><span class="n" id="vn"></span>
      <span class="w" id="hw"></span><span class="n" id="hn"></span>
    </div>
  </div>
  <div class="zeile"><span>Runde <b id="runde">–</b></span><span>Letzte <b id="letzte">–</b></span><span>Sprit <b id="sprit">–</b></span></div>
  <div class="funk" id="funk">Warte auf den Ingenieur ...</div>
</div>
<script src="sprache.js"></script>
<script src="themen.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let SPRACHE = "de";
const T = (de, en) => (SPRACHE === "en" ? en : de);
function spracheSetzen(sp) { if (sp && sp !== SPRACHE) { SPRACHE = sp; seiteUebersetzen(); } }
const komma = (x, n = 1) => Number(x).toFixed(n).replace(".", T(",", "."));
let aktuellesThema = null;
async function holen() {
  try {
    const d = await window.pywebview.api.overlay_daten();
    const i = d.info || {};
    spracheSetzen(d.sprache);
    if (d.thema !== aktuellesThema) {
      aktuellesThema = d.thema;
      const t = THEMEN[d.thema] || THEMEN[THEMA_STANDARD];
      const alpha = Math.round(Math.min(1, t.l[0][1] * 0.7) * 255).toString(16).padStart(2, "0");
      document.querySelector(".box").style.background = `radial-gradient(120% 90% at 0% 0%, ${t.l[0][0]}${alpha}, transparent 60%), #0B0B0E`;
    }
    if (d.zustand !== "bereit" || !i.acc) {
      $("platz").textContent = "–"; $("gesamt").textContent = "";
      $("funk").textContent = d.zustand === "bereit" ? T("Warte auf ACC ...", "Waiting for ACC ...") : T("Ingenieur ist nicht gestartet.", "Engineer is not started.");
      return;
    }
    $("platz").textContent = i.platz ? "P" + i.platz : "–";
    $("gesamt").textContent = i.gesamt ? "/ " + i.gesamt : "";
    for (const [s, w, n] of [["vorne", "vw", "vn"], ["hinten", "hw", "hn"]]) {
      const x = i[s];
      $(w).textContent = x ? x[2] : (s === "vorne" && i.platz === 1 ? T("Führung", "Leading") : "");
      $(n).textContent = x ? x[1] : "";
    }
    $("runde").textContent = i.runde + (i.runden_gesamt ? "/" + i.runden_gesamt : "");
    $("letzte").textContent = i.letzte || "–";
    const sprit = $("sprit");
    sprit.textContent = i.reicht ? komma(i.reicht) + T(" Rd", " laps") : komma(i.tank) + " L";
    sprit.classList.toggle("knapp", (i.reicht ?? 99) < 2);
    const letzter = (d.funk || []).filter((f) => f[0] !== "du").slice(-1)[0];
    $("funk").textContent = letzter ? d.ingenieur + ": " + letzter[1] : "";
  } catch (fehler) { /* Fenster wird gerade geschlossen */ }
}
$("zu").onclick = () => window.pywebview.api.overlay(false);
function los() { holen(); setInterval(holen, 300); }
if (window.pywebview && window.pywebview.api && window.pywebview.api.overlay_daten) los();
else window.addEventListener("pywebviewready", los);
</script>
</body>
</html>
